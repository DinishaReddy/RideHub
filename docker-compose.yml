version: '3.8'

services:

  mysql:
    image: mysql:8
    container_name: ridehub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ridehub123
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pridehub123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  vehiclemanager:
    build: ./vehiclemanager
    ports:
      - "8081:8081"
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy

  rentalmanager:
    build: ./rentalmanager
    ports:
      - "8082:8082"
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      vehiclemanager:
        condition: service_started

  maintenancemanager:
    build: ./maintenancemanager
    ports:
      - "8083:8083"
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      vehiclemanager:
        condition: service_started